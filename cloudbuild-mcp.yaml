# Build + push the remote MCP endpoint image
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.http', '-t', 'gcr.io/${PROJECT_ID}/appstore-mcp', '.']
    timeout: '600s'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/appstore-mcp']
images:
  - 'gcr.io/${PROJECT_ID}/appstore-mcp'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '900s'

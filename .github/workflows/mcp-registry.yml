name: publish MCP registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# Uses GitHub OIDC, so no secret is needed: the workflow's identity proves ownership
# of the io.github.thevalkdokk namespace.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write   # required for OIDC auth with the registry
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help | head -5

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
